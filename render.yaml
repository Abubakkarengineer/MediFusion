# Render Blueprint for MediFusion AI.
# Deploy via: Render Dashboard -> New -> Blueprint -> select this repo.
# Verify field names against Render's current docs before relying on this --
# schema has changed over time. Manual dashboard setup (see deployment
# guide) is the more reliable path if this blueprint doesn't apply cleanly.

services:
  - type: web
    name: medifusion-backend
    env: python
    plan: standard   # needs >=2GB RAM for torch+transformers+easyocr+whisper+shap; free/starter will OOM
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.11
      - key: MEDIFUSION_DATA_DIR
        value: /data
      - key: EASYOCR_MODEL_DIR
        value: /data/easyocr_models
      - key: HF_HOME
        value: /data/hf_cache
      - key: MEDIFUSION_JWT_SECRET
        generateValue: true
    disk:
      name: medifusion-data
      mountPath: /data
      sizeGB: 5

  - type: web
    name: medifusion-frontend
    env: python
    plan: starter
    rootDir: frontend
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run streamlit_app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.11
      - key: MEDIFUSION_API_URL
        value: https://REPLACE-WITH-BACKEND-URL.onrender.com/api
