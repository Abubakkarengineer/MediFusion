# Render Blueprint for MediFusion AI.
# Deploy via: Render Dashboard -> New -> Blueprint -> select this repo.
# Verify field names against Render's current docs before relying on this --
# schema has changed over time. Manual dashboard setup (see README ->
# Deployment) is the more reliable path if this blueprint doesn't apply
# cleanly.
#
# This defaults to a Free-tier-safe configuration: no Persistent Disk, so
# MEDIFUSION_DATA_DIR / EASYOCR_MODEL_DIR / HF_HOME are intentionally left
# unset (the app falls back to its own writable directory). If you attach a
# Disk on a paid plan, uncomment the disk block and the three env vars
# below it so the DB and model caches survive redeploys.

services:
  - type: web
    name: medifusion-backend
    env: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    envVars:
      - key: MEDIFUSION_JWT_SECRET
        generateValue: true
      - key: WHISPER_MODEL_SIZE
        value: tiny
      # - key: MEDIFUSION_DATA_DIR
      #   value: /data
      # - key: EASYOCR_MODEL_DIR   # unused now (OCR uses Tesseract, not EasyOCR)
      #   value: /data/easyocr_models
      # - key: HF_HOME
      #   value: /data/hf_cache
    # disk:
    #   name: medifusion-data
    #   mountPath: /data
    #   sizeGB: 5

  - type: web
    name: medifusion-frontend
    env: docker
    dockerfilePath: frontend/Dockerfile
    dockerContext: frontend
    plan: free
    envVars:
      - key: MEDIFUSION_API_URL
        value: https://REPLACE-WITH-BACKEND-URL.onrender.com/api
